# Supabase CLI — link a remote project with `supabase link`, then deploy Edge Functions.
# https://supabase.com/docs/guides/cli/config
project_id = "guest-signal-hospitality"

[functions.github-dispatch-lead-intake]
# Database Webhook uses a shared header secret instead of a JWT.
verify_jwt = false

[functions.send-approved-prospect]
# Called by an authenticated super-admin from the portal.
verify_jwt = true

[functions.prospect-approval-action]
# ntfy calls this without a user JWT; a short-lived one-time token is required.
verify_jwt = false

[functions.resend-engagement-webhook]
# Resend signs requests with Svix; the function verifies the raw payload.
verify_jwt = false

[functions.create-checkout-session]
# Public checkout starter; Stripe secret stays server-side.
verify_jwt = false

[functions.stripe-webhook]
# Stripe signs the payload; JWT verification must be off.
verify_jwt = false

[functions.growth-intervention-action]
# ntfy one-time tokens authorize approve/deny for growth interventions.
verify_jwt = false
