name: Research Cincinnati prospects

on:
  schedule:
    # Wednesday morning; drafts enter an approval queue and are never sent automatically.
    - cron: "15 13 * * 3"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Research without writing prospects
        required: false
        type: boolean
        default: true
      test_ntfy:
        description: Send one ntfy configuration test instead of researching
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: prospect-research
  cancel-in-progress: false

jobs:
  research:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.test_ntfy != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Research public business profiles and draft outreach
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || vars.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          APIFY_PROSPECT_ACTOR_ID: ${{ vars.APIFY_PROSPECT_ACTOR_ID || 'compass~crawler-google-places' }}
          APIFY_PROSPECT_INPUT_TEMPLATE_JSON: ${{ secrets.APIFY_PROSPECT_INPUT_TEMPLATE_JSON }}
          PROSPECT_SEARCH_QUERY: ${{ vars.PROSPECT_SEARCH_QUERY || 'independent restaurants in Cincinnati Ohio' }}
          PROSPECT_MAX_RESULTS: ${{ vars.PROSPECT_MAX_RESULTS || '20' }}
          PROSPECT_MIN_FIT_SCORE: ${{ vars.PROSPECT_MIN_FIT_SCORE || '55' }}
          NTFY_SERVER_URL: ${{ vars.NTFY_SERVER_URL || 'https://ntfy.sh' }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_ACCESS_TOKEN: ${{ secrets.NTFY_ACCESS_TOKEN }}
          SITE_ORIGIN: https://guestsignalhospitality.com
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: npm run growth:prospects

  test-ntfy:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.test_ntfy }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send ntfy test
        env:
          NTFY_SERVER_URL: ${{ vars.NTFY_SERVER_URL || 'https://ntfy.sh' }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_ACCESS_TOKEN: ${{ secrets.NTFY_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${NTFY_TOPIC}" ]]; then
            echo "NTFY_TOPIC is not configured."
            exit 1
          fi
          headers=(
            -H "Title: Guest Signal test"
            -H "Priority: default"
            -H "Tags: test_tube,email"
          )
          if [[ -n "${NTFY_ACCESS_TOKEN}" ]]; then
            headers+=(-H "Authorization: Bearer ${NTFY_ACCESS_TOKEN}")
          fi
          curl --fail-with-body --silent --show-error \
            "${headers[@]}" \
            --data "Test successful: outreach notifications are connected." \
            "${NTFY_SERVER_URL%/}/${NTFY_TOPIC}"
