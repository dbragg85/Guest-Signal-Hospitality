name: Research restaurant prospects

on:
  schedule:
    # Daily 10:15 AM Eastern — 10 prospects across all service markets.
    - cron: "15 14 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Research without writing prospects or sending ntfy
        required: false
        type: boolean
        default: false
      notify_only:
        description: Re-send ntfy Approve/Deny for pending drafts (skip Apify research)
        required: false
        type: boolean
        default: false
      enrich_emails_only:
        description: Pull public business emails for existing drafts and schedule already-approved ones
        required: false
        type: boolean
        default: false
      test_ntfy:
        description: Send one ntfy configuration test instead of researching
        required: false
        type: boolean
        default: false
      market_slug:
        description: Optional market slug (e.g. columbus-oh). Empty = all markets.
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: prospect-research
  cancel-in-progress: false

jobs:
  test-ntfy:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.test_ntfy == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send ntfy test
        env:
          NTFY_SERVER_URL: ${{ vars.NTFY_SERVER_URL || 'https://ntfy.sh' }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_ACCESS_TOKEN: ${{ secrets.NTFY_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${NTFY_TOPIC}" ]]; then
            echo "NTFY_TOPIC is not configured. Add repository secret NTFY_TOPIC=Guest_Signal"
            exit 1
          fi
          headers=(
            -H "Title: Guest Signal test"
            -H "Priority: default"
            -H "Tags: test_tube,email"
          )
          if [[ -n "${NTFY_ACCESS_TOKEN:-}" ]]; then
            headers+=(-H "Authorization: Bearer ${NTFY_ACCESS_TOKEN}")
          fi
          curl --fail-with-body --silent --show-error \
            "${headers[@]}" \
            --data "Test successful: outreach approvals will ping this topic." \
            "${NTFY_SERVER_URL%/}/${NTFY_TOPIC}"
          echo "Sent test notification to ${NTFY_SERVER_URL%/}/${NTFY_TOPIC}"

  research:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.test_ntfy != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Require ntfy for live approval runs
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run != true }}
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          set -euo pipefail
          if [[ -z "${NTFY_TOPIC}" ]]; then
            echo "NTFY_TOPIC secret is required for live prospect approval notifications."
            exit 1
          fi
          echo "ntfy topic configured"

      - name: Research public businesses and notify ntfy approvals
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || vars.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          APIFY_PROSPECT_ACTOR_ID: ${{ vars.APIFY_PROSPECT_ACTOR_ID || 'compass~crawler-google-places' }}
          APIFY_PROSPECT_INPUT_TEMPLATE_JSON: ${{ secrets.APIFY_PROSPECT_INPUT_TEMPLATE_JSON }}
          PROSPECT_ALL_MARKETS: ${{ vars.PROSPECT_ALL_MARKETS || '1' }}
          PROSPECT_MARKET_SLUG: ${{ github.event_name == 'workflow_dispatch' && inputs.market_slug || vars.PROSPECT_MARKET_SLUG || '' }}
          PROSPECT_SEARCH_QUERY: ${{ vars.PROSPECT_SEARCH_QUERY || '' }}
          PROSPECT_MAX_RESULTS: ${{ vars.PROSPECT_MAX_RESULTS || '10' }}
          PROSPECT_MIN_FIT_SCORE: ${{ vars.PROSPECT_MIN_FIT_SCORE || '55' }}
          NTFY_SERVER_URL: ${{ vars.NTFY_SERVER_URL || 'https://ntfy.sh' }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_ACCESS_TOKEN: ${{ secrets.NTFY_ACCESS_TOKEN }}
          SITE_ORIGIN: https://guestsignalhospitality.com
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == true && '1' || '0' }}
          NOTIFY_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.notify_only == true && '1' || '0' }}
          ENRICH_EMAILS_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.enrich_emails_only == true && '1' || '0' }}
          REQUIRE_NTFY: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run != true }}
        run: npm run growth:prospects
