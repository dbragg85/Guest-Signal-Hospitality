# Bulk Google review pull (Apify) for all restaurants in `restaurants`, then Guest Signal Score™
# monthly rebuild from `review_observations` (`run-google-gss-monthly.mjs`).
#
# The portal only reads Supabase; Apify runs here, not in the browser. Set Actions secrets
# APIFY_TOKEN and APIFY_GOOGLE_ACTOR_ID (or variable APIFY_GOOGLE_ACTOR_ID) like lead-intake.
#
# Example — April 2026 for every restaurant:
#   period_start: 2026-04-01
#   period_end:   2026-04-30
#   period_label: Apr 2026
#
# Optional `restaurant_slugs`: comma-separated slugs. Leave empty for all rows.
# Step 1 upserts only reviews whose dates fall inside the window; step 2 skips restaurants
# with zero observations in that window (see script logs).
#
# Ingest passes PERIOD_* to Apify as `reviewsStartDate` (when vars.APIFY_GOOGLE_SCORING_PERIOD_FILTER != 0)
# so the actor does not spend maxReviews on months before the scoring window. Each slug = one Apify run.
# Raise vars.GOOGLE_INGEST_MAX_APIFY_REVIEWS (default 250) if a venue has more reviews in-window than the cap.

name: Google Apify ingest + GSS monthly

on:
  workflow_dispatch:
    inputs:
      period_start:
        description: "Period start YYYY-MM-DD (UTC date)"
        required: true
        type: string
      period_end:
        description: "Period end YYYY-MM-DD (UTC date)"
        required: true
        type: string
      period_label:
        description: 'Label matching scorecards, e.g. "Apr 2026"'
        required: true
        type: string
      restaurant_slugs:
        description: "Optional comma-separated slug filter (empty = all)"
        required: false
        type: string
      dry_run:
        description: "true = list restaurants only, no Apify or DB writes"
        required: false
        default: "false"
        type: string

concurrency:
  group: google-gss-monthly-pipeline
  cancel-in-progress: false

jobs:
  ingest-and-score:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require Supabase credentials
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || vars.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "${SUPABASE_URL}" ] || [ -z "${SUPABASE_SERVICE_ROLE_KEY}" ]; then
            echo "::error::Set Secret SUPABASE_SERVICE_ROLE_KEY and SUPABASE_URL or Variable NEXT_PUBLIC_SUPABASE_URL."
            exit 1
          fi

      - name: Require Apify credentials (live ingest only)
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          APIFY_GOOGLE_ACTOR_ID: ${{ secrets.APIFY_GOOGLE_ACTOR_ID || vars.APIFY_GOOGLE_ACTOR_ID }}
        run: |
          if [ -z "${APIFY_TOKEN}" ] || [ -z "${APIFY_GOOGLE_ACTOR_ID}" ]; then
            echo "::error::Set Secret APIFY_TOKEN and APIFY_GOOGLE_ACTOR_ID (or Variable APIFY_GOOGLE_ACTOR_ID) so Apify can run."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install
        run: npm ci

      - name: Apify Google ingest (review_observations)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || vars.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          APIFY_GOOGLE_ACTOR_ID: ${{ secrets.APIFY_GOOGLE_ACTOR_ID || vars.APIFY_GOOGLE_ACTOR_ID }}
          APIFY_GOOGLE_START_URL: ${{ vars.APIFY_GOOGLE_START_URL }}
          APIFY_GOOGLE_INPUT_TEMPLATE_JSON: ${{ vars.APIFY_GOOGLE_INPUT_TEMPLATE_JSON }}
          LEAD_INTAKE_MAX_REVIEWS: ${{ vars.LEAD_INTAKE_MAX_REVIEWS || '50' }}
          GOOGLE_INGEST_MAX_APIFY_REVIEWS: ${{ vars.GOOGLE_INGEST_MAX_APIFY_REVIEWS || '250' }}
          APIFY_GOOGLE_SCORING_PERIOD_FILTER: ${{ vars.APIFY_GOOGLE_SCORING_PERIOD_FILTER || '1' }}
          GOOGLE_INGEST_THROTTLE_MS: ${{ vars.GOOGLE_INGEST_THROTTLE_MS || '2500' }}
          PERIOD_START: ${{ github.event.inputs.period_start }}
          PERIOD_END: ${{ github.event.inputs.period_end }}
          PERIOD_LABEL: ${{ github.event.inputs.period_label }}
          RESTAURANT_SLUGS: ${{ github.event.inputs.restaurant_slugs }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: npm run pipeline:google:apify-ingest-all

      - name: Rebuild GSS scorecards for period
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || vars.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PERIOD_START: ${{ github.event.inputs.period_start }}
          PERIOD_END: ${{ github.event.inputs.period_end }}
          PERIOD_LABEL: ${{ github.event.inputs.period_label }}
          RESTAURANT_SLUGS: ${{ github.event.inputs.restaurant_slugs }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          GSS_REVIEW_SOURCES: google
        run: npm run pipeline:google:gss
