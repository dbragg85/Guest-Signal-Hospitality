name: Monthly Yelp Pipeline

on:
  workflow_dispatch:
    inputs:
      period_start:
        description: "Optional period start (YYYY-MM-DD)"
        required: false
      period_end:
        description: "Optional period end (YYYY-MM-DD)"
        required: false
      period_label:
        description: "Optional period label (e.g., Mar 2026)"
        required: false
      restaurant_slugs:
        description: "Optional comma-separated slug filter"
        required: false
      dry_run:
        description: "Set true to preview only"
        required: false
        default: "false"
  schedule:
    - cron: "15 5 1 * *"

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run monthly Yelp pipeline
        run: npm run pipeline:yelp:monthly
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          APIFY_YELP_ACTOR_ID: ${{ secrets.APIFY_YELP_ACTOR_ID }}
          PERIOD_START: ${{ github.event.inputs.period_start }}
          PERIOD_END: ${{ github.event.inputs.period_end }}
          PERIOD_LABEL: ${{ github.event.inputs.period_label }}
          RESTAURANT_SLUGS: ${{ github.event.inputs.restaurant_slugs }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
