# Processes pending service-tier lead_intake_submissions (free + Monitor/Growth/Elevate).
# Uses prior completed calendar month for scoring; see scripts/process-lead-intake-snapshot.mjs.
# Creates restaurant, review_observations, snapshots, scorecards; then invites + memberships when enabled.
# Apify optional; on failure or missing credits uses 15 mock reviews + same rubric.
#
# Immediate run (no wait for schedule): GitHub → Actions → this workflow → "Run workflow".
# Optional input `lead_id` limits processing to one row. The static Pages site cannot safely call GitHub.
#
# Requires SUPABASE_SERVICE_ROLE_KEY as an Actions *Secret* (service_role JWT).
# Project URL: Secret SUPABASE_URL *or* reuse Variable NEXT_PUBLIC_SUPABASE_URL (same host as Studio).
# Do not use `secrets.*` in job-level `if:` — GitHub rejects that as an invalid workflow.

name: Process lead intake snapshots

on:
  workflow_dispatch:
    inputs:
      lead_id:
        description: Optional UUID of a single lead_intake_submissions row
        required: false
        type: string
  schedule:
    # Every 10 minutes (was hourly) so restaurant + snapshot + membership land sooner without manual dispatch.
    - cron: "*/10 * * * *"

concurrency:
  group: lead-intake-snapshot
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Require Supabase credentials
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || vars.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "${SUPABASE_URL}" ] || [ -z "${SUPABASE_SERVICE_ROLE_KEY}" ]; then
            echo "::error::Add Actions Secret SUPABASE_SERVICE_ROLE_KEY (service_role JWT from Supabase). Set either Secret SUPABASE_URL or Variable NEXT_PUBLIC_SUPABASE_URL to your project URL (https://<project-ref>.supabase.co)."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install
        run: npm ci

      - name: Process pending leads
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || vars.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          APIFY_YELP_ACTOR_ID: ${{ secrets.APIFY_YELP_ACTOR_ID }}
          LEAD_INTAKE_APIFY_YELP_URL: ${{ vars.LEAD_INTAKE_APIFY_YELP_URL }}
          LEAD_INTAKE_ID: ${{ github.event.inputs.lead_id }}
          LEAD_INTAKE_INVITE_PORTAL_USERS: ${{ vars.LEAD_INTAKE_INVITE_PORTAL_USERS || '1' }}
          LEAD_INTAKE_INVITE_REDIRECT_URL: ${{ vars.LEAD_INTAKE_INVITE_REDIRECT_URL }}
        run: npm run pipeline:lead-intake
