# Processes pending service-tier lead_intake_submissions (free + Monitor/Growth/Elevate).
# Uses prior completed calendar month for scoring; see scripts/process-lead-intake-snapshot.mjs.
# Creates restaurant, review_observations, snapshots, scorecards; then invites + memberships when enabled;
# optional Resend welcome email to the submitter (RESEND_API_KEY + RESEND_FROM).
# Apify optional; on failure or missing credits uses 15 mock reviews + same rubric.
#
# Immediate run (no wait for schedule): GitHub → Actions → this workflow → "Run workflow".
# Optional input `lead_id` limits processing to one row. The static Pages site cannot safely call GitHub;
# use repository_dispatch (e.g. from Supabase Edge Function `github-dispatch-lead-intake` + Database Webhook).
# repository_dispatch type `lead_intake_process` with JSON body `{ "lead_id": "<uuid>" }` (optional) also runs this job.
# If the job succeeds but logs "No pending lead_intake_submissions", open the run's **Summary** tab: the script
# writes diagnostics there (counts + recent rows). The Action does **not** emit a .sql file — data is in Supabase.
# The job log also prints the same. Typical causes: submission
# used plain /contact (inquiry_plan=general), row already converted, or GitHub SUPABASE_URL points at a
# different project than production. Re-run with FORCE_REPROCESS=1 only when you intend to reprocess.
#
# Requires SUPABASE_SERVICE_ROLE_KEY as an Actions *Secret* (service_role JWT).
# Project URL: Secret SUPABASE_URL *or* reuse Variable NEXT_PUBLIC_SUPABASE_URL (same host as Studio).
# Do not use `secrets.*` in job-level `if:` — GitHub rejects that as an invalid workflow.

name: Process lead intake snapshots

on:
  workflow_dispatch:
    inputs:
      lead_id:
        description: Optional UUID of a single lead_intake_submissions row
        required: false
        type: string
  repository_dispatch:
    types: [lead_intake_process]
  schedule:
    # Every 10 minutes (was hourly) so restaurant + snapshot + membership land sooner without manual dispatch.
    - cron: "*/10 * * * *"

concurrency:
  group: lead-intake-snapshot
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Require Supabase credentials
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || vars.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "${SUPABASE_URL}" ] || [ -z "${SUPABASE_SERVICE_ROLE_KEY}" ]; then
            echo "::error::Add Actions Secret SUPABASE_SERVICE_ROLE_KEY (service_role JWT from Supabase). Set either Secret SUPABASE_URL or Variable NEXT_PUBLIC_SUPABASE_URL to your project URL (https://<project-ref>.supabase.co)."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install
        run: npm ci

      - name: Process pending leads
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || vars.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          YELP_FUSION_API_KEY: ${{ secrets.YELP_FUSION_API_KEY }}
          APIFY_GOOGLE_ACTOR_ID: ${{ secrets.APIFY_GOOGLE_ACTOR_ID || vars.APIFY_GOOGLE_ACTOR_ID }}
          APIFY_YELP_ACTOR_ID: ${{ secrets.APIFY_YELP_ACTOR_ID || vars.APIFY_YELP_ACTOR_ID }}
          LEAD_INTAKE_APIFY_YELP_URL: ${{ vars.LEAD_INTAKE_APIFY_YELP_URL }}
          LEAD_INTAKE_ENABLE_YELP: ${{ vars.LEAD_INTAKE_ENABLE_YELP || '0' }}
          LEAD_INTAKE_MAX_REVIEWS: ${{ vars.LEAD_INTAKE_MAX_REVIEWS || '50' }}
          APIFY_GOOGLE_SCORING_PERIOD_FILTER: ${{ vars.APIFY_GOOGLE_SCORING_PERIOD_FILTER || '1' }}
          SCORING_TIMEZONE: ${{ vars.SCORING_TIMEZONE || 'America/New_York' }}
          APIFY_GOOGLE_START_URL: ${{ vars.APIFY_GOOGLE_START_URL }}
          LEAD_INTAKE_SUCCESS_WEBHOOK_URL: ${{ secrets.LEAD_INTAKE_SUCCESS_WEBHOOK_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM: ${{ vars.RESEND_FROM }}
          LEAD_INTAKE_ID: ${{ github.event.inputs.lead_id || github.event.client_payload.lead_id }}
          LEAD_INTAKE_INVITE_PORTAL_USERS: ${{ vars.LEAD_INTAKE_INVITE_PORTAL_USERS || '1' }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          LEAD_INTAKE_PORTAL_BASE_URL: ${{ vars.LEAD_INTAKE_PORTAL_BASE_URL }}
          LEAD_INTAKE_INVITE_REDIRECT_URL: ${{ vars.LEAD_INTAKE_INVITE_REDIRECT_URL }}
          FORCE_REPROCESS: ${{ vars.FORCE_REPROCESS || '0' }}
        run: npm run pipeline:lead-intake
