name: Today's email engagement report

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Generate report without sending email
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: todays-email-engagement
  cancel-in-progress: true

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Send email engagement report
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || vars.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          OWNER_REPORT_EMAIL_TO: ${{ vars.OWNER_REPORT_EMAIL_TO || secrets.OWNER_REPORT_EMAIL_TO || 'audit@guestsignalhospitality.com' }}
          OWNER_REPORT_EMAIL_FROM: ${{ vars.OWNER_REPORT_EMAIL_FROM || 'Guest Signal <audit@guestsignalhospitality.com>' }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == true && '1' || '0' }}
        run: |
          set -euo pipefail
          if [[ -z "${RESEND_API_KEY}" && "${DRY_RUN}" != "1" ]]; then
            echo "RESEND_API_KEY secret is required to email the report."
            exit 1
          fi
          npm run growth:todays-engagement
